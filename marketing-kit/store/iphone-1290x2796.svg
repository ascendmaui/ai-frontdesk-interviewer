<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="2796" viewBox="0 0 430 932" role="img" aria-labelledby="title desc">
  <title id="title">AI Front Desk — iPhone store frame</title>
  <desc id="desc">Store screenshot template at 1290 by 2796 (430 by 932 points). Phone chrome around the published AI Front Desk offer. Not a capture of a shipped app binary.</desc>
  <defs>
