name: CI

on:
  push:
    branches: [main, "finish/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh lockfile metadata
        run: npm install --package-lock-only
      - name: Commit refreshed lockfile on finish branch
        if: github.event_name == 'push' && github.ref_name == 'finish/closer-machine-current-main'
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh package lock"
          git push origin HEAD:${GITHUB_REF_NAME}
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run build
