name: Dependency hardening

on:
  push:
    branches: [main, "finish/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

jobs:
  verify-production-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
