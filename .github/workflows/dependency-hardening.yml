name: Dependency hardening

on:
  push:
    branches: ["finish/sales-coach-certification"]

permissions:
  contents: write

jobs:
  patch-production-deps:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finish/sales-coach-certification
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch vulnerable production dependencies
        run: |
          npm install next@16.3.4 --save-exact
          npm audit fix --omit=dev
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Commit lockfile hardening
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: patch production dependency vulnerabilities"
          git push origin HEAD:finish/sales-coach-certification
